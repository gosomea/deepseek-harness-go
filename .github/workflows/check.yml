name: check
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go format
        shell: bash
        run: |
          files="$(gofmt -l cordis examples scripts)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=60s -coverprofile=coverage.out ./...
      - run: go run ./scripts/doccheck -coverage coverage.out
      - run: go run ./scripts/doccheck
      - run: go build ./...
